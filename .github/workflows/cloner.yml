name: Restricted Content Cloner Worker

on:
  repository_dispatch:
    types: [clone_content]
  workflow_dispatch:

jobs:
  clone_job:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Public Worker Code
        uses: actions/checkout@v4

      - name: Optimize Linux Network Stack (Google TCP BBR & 64MB Buffers)
        run: |
          sudo modprobe tcp_bbr || true
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=67108864 || true
          sudo sysctl -w net.core.wmem_max=67108864 || true
          sudo sysctl -w net.ipv4.tcp_rmem="4096 1048576 67108864" || true
          sudo sysctl -w net.ipv4.tcp_wmem="4096 1048576 67108864" || true
          sudo sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
          sudo sysctl -w net.ipv4.tcp_window_scaling=1 || true
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1 || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Cloner Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DUMP_CHANNEL_ID: ${{ secrets.DUMP_CHANNEL_ID }}
          USER_ID: ${{ github.event.client_payload.user_id }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          STATUS_MSG_ID: ${{ github.event.client_payload.status_msg_id }}
          PEER_ID: ${{ github.event.client_payload.peer_id }}
          MSG_IDS: ${{ github.event.client_payload.msg_ids }}
          MAX_MB: ${{ github.event.client_payload.max_mb }}
          WORKERS: ${{ github.event.client_payload.workers }}
          SOURCE_LINK: ${{ github.event.client_payload.source_link }}
          HELPER_BOT_ID: ${{ github.event.client_payload.helper_bot_id }}
        run: python cloner.py
